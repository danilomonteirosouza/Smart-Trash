name: lixeira_inteligente
description: Lixeira seletiva inteligente conectada ao ESP32 por MQTT/HiveMQ.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.11.11
  sqflite: ^2.4.4
  path: ^1.9.1
  flutter_secure_storage: ^11.1.1
  camera: ^0.12.1
  google_mlkit_image_labeling: ^0.16.1
  lottie: ^3.5.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/branding/
